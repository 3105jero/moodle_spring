spring.application.name=history3

# ── Base de datos H2 ────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:eventify_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────────────────────
# none — Flyway toma el control total del esquema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── Auditoría SQL en consola ─────────────────────────────────────
# Muestra las queries formateadas
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Muestra los valores reales de los parámetros (no los signos ?)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ── Flyway ──────────────────────────────────────────────────────
spring.flyway.enabled=true
# Carpeta donde Flyway busca los scripts SQL
spring.flyway.locations=classpath:db/migration

# ── Consola H2 ──────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Thymeleaf ───────────────────────────────────────────────────
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ── Servidor ────────────────────────────────────────────────────
server.port=8080

# ── Swagger ─────────────────────────────────────────────────────
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html